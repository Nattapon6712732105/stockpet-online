{% extends 'base.html' %}
{% block page_title %}ตัดจ่ายสินค้าออกจากคลังกลาง{% endblock %}

{% block content %}
<div class="card" style="max-width:600px;">
  <div class="card-header">
    <span class="card-title">📤 ตัดจ่ายสินค้าออกจากคลังกลาง</span>
  </div>
  <div class="card-body">
    <div class="alert alert-warning mb-4">
      ⚠️ หน้านี้สำหรับตัดสต็อกโดยตรง เช่น สินค้าชำรุด, เสียหาย, หมดอายุ หรือเบิกใช้ภายในร้าน
    </div>
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">เลือกสินค้า</label>
        <select name="product_id" class="form-control" required>
          <option value="">-- เลือกสินค้า --</option>
          {% for p in products %}
            <option value="{{ p.id }}">
              [{{ p.sku }}] {{ p.name }} (คงเหลือ: {% if p.central_stock %}{{ p.central_stock.quantity }}{% else %}0{% endif %} {{ p.unit }})
            </option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">จำนวนที่ต้องการตัดออก</label>
        <input type="number" name="quantity" class="form-control qty-input"
               min="1" placeholder="0" required>
      </div>
      <div class="form-group">
        <label class="form-label">สาเหตุการตัดจ่าย</label>
        <select name="reason" class="form-control" required>
          <option value="สินค้าชำรุด/แตกหัก">สินค้าชำรุด / แตกหัก / เสียหาย</option>
          <option value="สินค้าหมดอายุ">สินค้าหมดอายุ</option>
          <option value="เบิกใช้ภายในคลัง">เบิกใช้ภายในคลัง / ร้าน</option>
          <option value="ปรับปรุงยอดสต็อก">ปรับปรุงยอดสต็อก (นับสต็อกจริงไม่ตรง)</option>
          <option value="อื่นๆ">อื่นๆ</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">รายละเอียดเพิ่มเติม / หมายเหตุ</label>
        <input type="text" name="note" class="form-control"
               placeholder="เช่น ถุงขาดระหว่างขนส่ง หรือระบุเลขอ้างอิง">
      </div>
      <div class="flex gap-2 mt-4">
        <button type="submit" class="btn btn-danger" onclick="return confirm('ยืนยันการตัดสินค้าออกจากสต็อกคลังกลาง?')">
          📤 บันทึกตัดสต็อก
        </button>
        <a href="{% url 'home' %}" class="btn btn-secondary">ยกเลิก</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
