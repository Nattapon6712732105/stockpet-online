{% extends 'base.html' %}
{% block page_title %}รับสินค้าเข้าคลังกลาง{% endblock %}

{% block content %}
<div class="card" style="max-width:600px;">
  <div class="card-header">
    <span class="card-title">📥 รับสินค้าเข้าคลังกลาง</span>
  </div>
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">สินค้า</label>
        <select name="product_id" class="form-control" required>
          <option value="">-- เลือกสินค้า --</option>
          {% for p in products %}
            <option value="{{ p.id }}">
              [{{ p.sku }}] {{ p.name }} (คงเหลือ: {% if p.central_stock %}{{ p.central_stock.quantity }}{% else %}0{% endif %} {{ p.unit }})
            </option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">จำนวนที่รับ</label>
        <input type="number" name="quantity" class="form-control qty-input"
               min="1" placeholder="0" required>
      </div>
      <div class="form-group">
        <label class="form-label">หมายเหตุ</label>
        <input type="text" name="note" class="form-control"
               placeholder="เช่น รับจากซัพพลายเออร์ ABC">
      </div>
      <div class="flex gap-2 mt-4">
        <button type="submit" class="btn btn-primary">📥 บันทึก</button>
        <a href="{% url 'home' %}" class="btn btn-secondary">ยกเลิก</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
