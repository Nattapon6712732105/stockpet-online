<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ — คลังอาหารสัตว์ ขุขันธ์</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/theme.css' %}">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <!-- โลโก้ลำดวน -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" fill="none" width="56" height="56">
        <circle cx="30" cy="30" r="29" fill="#1F2F4D" stroke="#D9B98A" stroke-width="1.5"/>
        <g transform="translate(30,30)">
          <ellipse cx="0" cy="-11" rx="5" ry="10" fill="none" stroke="#F3E3A3" stroke-width="1.5" transform="rotate(0)"/>
          <ellipse cx="0" cy="-11" rx="5" ry="10" fill="none" stroke="#F3E3A3" stroke-width="1.5" transform="rotate(72)"/>
          <ellipse cx="0" cy="-11" rx="5" ry="10" fill="none" stroke="#F3E3A3" stroke-width="1.5" transform="rotate(144)"/>
          <ellipse cx="0" cy="-11" rx="5" ry="10" fill="none" stroke="#F3E3A3" stroke-width="1.5" transform="rotate(216)"/>
          <ellipse cx="0" cy="-11" rx="5" ry="10" fill="none" stroke="#F3E3A3" stroke-width="1.5" transform="rotate(288)"/>
          <circle cx="0" cy="0" r="4" fill="#D9B98A" stroke="#F3E3A3" stroke-width="1"/>
        </g>
      </svg>
      <div class="login-logo-title" style="margin-top:12px;">คลังอาหารสัตว์<br>ขุขันธ์</div>
      <div class="login-logo-sub">ระบบจัดการคลังสินค้า · หลายสาขา</div>
    </div>

    {% if form.errors %}
      <div class="alert alert-danger">❌ ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label" for="id_username">ชื่อผู้ใช้</label>
        <input type="text" name="username" id="id_username" class="form-control"
               placeholder="กรอกชื่อผู้ใช้" autocomplete="username" autofocus required>
      </div>
      <div class="form-group">
        <label class="form-label" for="id_password">รหัสผ่าน</label>
        <input type="password" name="password" id="id_password" class="form-control"
               placeholder="กรอกรหัสผ่าน" autocomplete="current-password" required>
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn btn-primary w-full" style="margin-top:8px;">
        🔑 เข้าสู่ระบบ
      </button>
    </form>
  </div>
</div>
<script src="{% static 'js/app.js' %}"></script>
</body>
</html>
