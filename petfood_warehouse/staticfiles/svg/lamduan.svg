<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" fill="none">
  <!-- ดอกลำดวน 5 กลีบ แบบเส้นเรียบ -->
  <g transform="translate(30,30)">
    <!-- กลีบ 1 (บน) -->
    <ellipse cx="0" cy="-14" rx="6" ry="12" fill="none" stroke="#F3E3A3" stroke-width="1.8" transform="rotate(0)"/>
    <!-- กลีบ 2 -->
    <ellipse cx="0" cy="-14" rx="6" ry="12" fill="none" stroke="#F3E3A3" stroke-width="1.8" transform="rotate(72)"/>
    <!-- กลีบ 3 -->
    <ellipse cx="0" cy="-14" rx="6" ry="12" fill="none" stroke="#F3E3A3" stroke-width="1.8" transform="rotate(144)"/>
    <!-- กลีบ 4 -->
    <ellipse cx="0" cy="-14" rx="6" ry="12" fill="none" stroke="#F3E3A3" stroke-width="1.8" transform="rotate(216)"/>
    <!-- กลีบ 5 -->
    <ellipse cx="0" cy="-14" rx="6" ry="12" fill="none" stroke="#F3E3A3" stroke-width="1.8" transform="rotate(288)"/>
    <!-- กลางดอก -->
    <circle cx="0" cy="0" r="4.5" fill="#D9B98A" stroke="#F3E3A3" stroke-width="1"/>
    <circle cx="0" cy="0" r="2" fill="#F3E3A3"/>
  </g>
</svg>
